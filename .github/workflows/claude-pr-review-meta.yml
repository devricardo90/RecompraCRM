name: Claude PR Review (review infrastructure)

# ARCH-04 Stage 1, secondary reviewer.
#
# anthropics/claude-code-action@v1 refuses to run when its own workflow file
# differs from the version on the default branch ("Workflow validation
# failed... must have identical content", not retryable) and skips with a
# green check and no verdict. That makes the primary reviewer structurally
# unable to review any PR that edits claude-pr-review.yml - observed on PR 37
# run 35258611604, and silently true of PRs #27 and #28 before it.
#
# This workflow exists to review exactly those PRs. It never changes when
# claude-pr-review.yml does, so it stays identical to the default branch and
# passes that validation. It is deliberately NOT a second reviewer for normal
# PRs: the paths filter below restricts it to changes to the primary review
# workflow, so ordinary PRs keep getting exactly one review from exactly one
# reviewer.

# ARCH-04 Stage 3: dispatch-only, like the primary.
#
# The automatic pull_request trigger is gone here too. Leaving it would have
# broken the owner's rule that a push alone must NEVER invoke an LLM review -
# and it demonstrably did: on PR 41 the Stage 4 acceptance probe pushed twice
# with no primary runs, while this workflow started the model both times
# (runs 35365924867 and 35365946583). The cutover was not finished until this
# trigger went too.
#
# Removing it is safe now in a way it was not in Stage 1. A dispatched review
# runs the DEFAULT BRANCH's definition, so the action's workflow validation
# passes by construction and the dispatched primary can review PRs that edit
# claude-pr-review.yml - the very failure that made this secondary reviewer
# necessary. The secondary stays permanently available for explicitly
# authorized review-infrastructure maintenance, as the owner required; it is
# simply no longer triggered by a push.
run-name: >-
  Claude PR Review (review infrastructure) · PR #${{ inputs.pr_number }} @ ${{ inputs.expected_head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      expected_head_sha:
        description: Exact HEAD the dispatcher resolved for that PR
        required: true
        type: string

# Evaluated at trigger time, so it can only read github/inputs/vars - never a
# job-step output. Without the inputs fallback every dispatched run would share
# one empty-suffix group and cancel unrelated PRs' reviews.
concurrency:
  group: claude-pr-review-meta-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # No event-branched guard: workflow_dispatch is the only trigger, and
    # draft/head-repo do not exist on its payload. The verify step below checks
    # those facts against the PR's live state instead, which is stronger.
    runs-on: ubuntu-latest
    # Minimal: read the code, write the review. No actions: write, because this
    # workflow never dispatches anything.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Read-only, but required: the allowlist below permits `gh run view` and
      # the prompt tells the reviewer to inspect CI state. Without it that tool
      # 403s and the instruction points at something that cannot work.
      actions: read
      id-token: write

    steps:
      # Dispatch inputs reach the shell through env, never through `${{ }}`
      # interpolation into the script source: GitHub substitutes those before
      # Bash parses the line, so a value containing $(...) would execute with
      # this job's pull-requests/issues write token. As env vars they are data.
      # Both are then shape-checked, so anything downstream that does use them
      # via interpolation is working from a validated integer and hex sha.
      - name: Resolve PR and expected HEAD
        id: resolve
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          PR_NUMBER="$INPUT_PR_NUMBER"
          EXPECTED_HEAD="$INPUT_EXPECTED_HEAD"
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "Refusing: pr_number is not a positive integer." >&2; exit 1 ;;
          esac
          case "$EXPECTED_HEAD" in
            ''|*[!0-9a-fA-F]*) echo "Refusing: expected_head_sha is not a hex sha." >&2; exit 1 ;;
          esac
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "expected_head=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"

      # Checked against the PR's live state, not the dispatch payload: a push
      # can land between the HEAD being resolved and this job starting, and a
      # verdict naming the superseded commit would be worse than no verdict.
      - name: Verify PR is open, non-draft, same-repo and still at the expected HEAD
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env for the same reason as above, even though both values are
          # already shape-checked.
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.resolve.outputs.expected_head }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATA=$(gh pr view "$PR_NUMBER" \
            --repo "$TARGET_REPO" \
            --json state,isDraft,headRefOid,isCrossRepository)
          ACTUAL_HEAD=$(echo "$DATA" | jq -r .headRefOid)
          STATE=$(echo "$DATA" | jq -r .state)
          DRAFT=$(echo "$DATA" | jq -r .isDraft)
          CROSS_REPO=$(echo "$DATA" | jq -r .isCrossRepository)
          echo "state=$STATE draft=$DRAFT cross_repo=$CROSS_REPO expected=$EXPECTED_HEAD actual=$ACTUAL_HEAD"
          if [ "$STATE" != "OPEN" ] || [ "$DRAFT" != "false" ] || [ "$CROSS_REPO" != "false" ] || [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping review: PR is not an open, non-draft, same-repo PR still at the expected HEAD."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact PR head
        if: steps.verify.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.expected_head }}
          fetch-depth: 1

      - name: Independent Claude review
        if: steps.verify.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.resolve.outputs.pr_number }}
            EXACT HEAD: ${{ steps.resolve.outputs.expected_head }}

            You are the independent code reviewer for Rick Loop, reviewing a change to
            the repository's own review infrastructure. This is READ-ONLY review work.
            Do not edit files, commit, push, merge, or modify the implementation.

            This PR changes `.github/workflows/claude-pr-review.yml` - the workflow that
            reviews every other PR. The primary reviewer cannot review this PR, because
            the action refuses to run when its own workflow file differs from the default
            branch. That is why this separate workflow exists.

            Weigh accordingly. A defect here silently weakens or disables the review gate
            for every future PR, and the failure mode already observed is a green check
            with no review performed. Pay particular attention to: whether the mandatory
            clean-exact-HEAD review before merge still holds; whether any path lets a PR
            merge without a real published verdict; trigger and concurrency semantics
            (including which contexts are readable at trigger time); whether a stale or
            superseded HEAD can be reviewed or can suppress a needed review; and
            permission scope.

            Review the exact PR HEAD above. Start with the PR diff and only inspect
            repository files that are relevant to changed behavior or governing
            specs/protocols. Inspect CI state only with non-watching commands; never
            invoke any watch/poll-until-complete mode from inside the review because the
            current Claude review is itself one of the checks.

            Be economical with tool calls: do not repeatedly inspect the same evidence, and
            do not explore unrelated repository areas. Conclude as soon as the actionable
            review is complete.

            Findings must be concrete and actionable. Use inline comments for specific defects.
            Do not create an inline comment merely for style preference or praise.

            At the end, publish exactly one top-level PR result comment with `gh pr comment`.

            If and only if there are ZERO actionable findings of any severity and ZERO inline
            findings created by this review, the top-level comment MUST begin exactly:

            Reviewed commit: ${{ steps.resolve.outputs.expected_head }}
            No major issues found.
            Review provider: Claude Code Action

            If there is ANY actionable finding, the top-level comment MUST instead begin:

            Reviewed commit: ${{ steps.resolve.outputs.expected_head }}
            Review result: FINDINGS
            Review provider: Claude Code Action

            In a findings result, never use the phrase `no major issues` anywhere. A clean
            result is exact-head evidence used by a deterministic merge gate, so never mix a
            clean verdict with findings or uncertainty.
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git status:*),Bash(git rev-parse:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*)"
