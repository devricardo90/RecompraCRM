name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://recompra:recompra_ci_only@localhost:5432/recompra?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recompra
          POSTGRES_PASSWORD: recompra_ci_only
          POSTGRES_DB: recompra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recompra -d recompra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Verify database connection
        run: npm run db:health

      - name: Test migration compatibility
        run: npm run test:migration-compat

      - name: Test Customer persistence
        run: npm run test:customer

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
