name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Independent Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EXACT HEAD: ${{ github.event.pull_request.head.sha }}

            You are the independent code reviewer for Rick Loop. This is READ-ONLY review work.
            Do not edit files, commit, push, merge, or modify the implementation.

            Review the exact PR HEAD above. Read the repository's relevant spec, protocol,
            STATE/HANDOFF context and changed files. Inspect the full PR diff and CI context.
            Focus on correctness, regressions, state-machine/terminality errors, security,
            data integrity, concurrency, date/time semantics, test quality, missing negative
            or edge-case coverage, and violations of reviewed specs or loop invariants.

            Findings must be concrete and actionable. Use inline comments for specific defects.
            Do not create an inline comment merely for style preference or praise.

            At the end, publish exactly one top-level PR result comment with `gh pr comment`.

            If and only if there are ZERO actionable findings of any severity and ZERO inline
            findings created by this review, the top-level comment MUST begin exactly:

            Reviewed commit: ${{ github.event.pull_request.head.sha }}
            No major issues found.
            Review provider: Claude Code Action

            If there is ANY actionable finding, the top-level comment MUST instead begin:

            Reviewed commit: ${{ github.event.pull_request.head.sha }}
            Review result: FINDINGS
            Review provider: Claude Code Action

            In a findings result, never use the phrase `no major issues` anywhere. A clean
            result is exact-head evidence used by a deterministic merge gate, so never mix a
            clean verdict with findings or uncertainty.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*)"
