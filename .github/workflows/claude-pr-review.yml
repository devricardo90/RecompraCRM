name: Claude PR Review

# ARCH-04 Stage 3: controller-dispatched review only.
#
# The automatic per-push trigger is gone. A push NEVER invokes an LLM review
# now; scripts/rick-loop-review-dispatch.mjs decides, and it dispatches only
# after CI is green on the exact HEAD, the deterministic preflight passes, and
# no run or published verdict already covers that HEAD. This is OWNER-02
# (REVIEW_TRIGGER_ECONOMICS) as authorized: the per-push *execution* is
# removed, while the mandatory clean exact-HEAD independent review before merge
# is untouched.
#
# Removal happens here and not earlier because the owner required the
# replacement path to be implemented, tested and demonstrably operational
# first. The live acceptance evidence is recorded in
# docs/evidence/ARCH-04-validation.md, which is added by this same PR: six
# pushes producing zero review runs, one authorized HEAD producing exactly one
# dispatched review with a real exact-head verdict (run 35366498301), and
# duplicate dispatch refused in both the in-flight and already-reviewed
# states.
#
# The dispatcher runs this workflow from the DEFAULT BRANCH, never from the PR
# branch, so the definition executing here is always the trusted one (see
# buildDispatchArgs). That costs the natural correlation handle: GitHub records
# a default-branch dispatch against the default branch, so `run.headSha` is
# main's sha and not the PR's. This run-name carries the PR number and the
# reviewed HEAD instead, and the dispatcher and watcher match on it.
#
# A useful consequence of running main's definition: the action's own workflow
# validation ("must have identical content to the default branch") passes by
# construction, so a dispatched review no longer fails open on PRs that edit
# this file - the failure mode that made the Stage 1 secondary reviewer
# necessary in the first place. The secondary reviewer stays available for
# review-infrastructure changes regardless, as the owner required.
run-name: >-
  Claude PR Review · PR #${{ inputs.pr_number }} @ ${{ inputs.expected_head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      expected_head_sha:
        description: Exact HEAD the dispatcher resolved for that PR
        required: true
        type: string

# Per PR, not per HEAD: a newer dispatch for the same PR supersedes an older
# one, and cancelling the stale run is correct because its expected_head_sha is
# no longer current. Evaluated at trigger time, so it can only read
# github/inputs/vars - never a job-step output.
concurrency:
  group: claude-pr-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # No event-branched guard any more: workflow_dispatch is the only trigger,
    # and draft/head-repo do not exist on its payload. Those facts are checked
    # against the PR's live state in the verify step below, which is stronger
    # anyway - the payload could be stale by the time the job starts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      # Dispatch inputs reach the shell through env, never through `${{ }}`
      # interpolation into the script source: GitHub substitutes those before
      # Bash parses the line, so a value containing $(...) would execute with
      # this job's pull-requests/issues write token. As env vars they are data.
      # Both are then shape-checked, so anything downstream that does use them
      # via interpolation is working from a validated integer and hex sha.
      - name: Resolve PR and expected HEAD
        id: resolve
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          PR_NUMBER="$INPUT_PR_NUMBER"
          EXPECTED_HEAD="$INPUT_EXPECTED_HEAD"
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "Refusing: pr_number is not a positive integer." >&2; exit 1 ;;
          esac
          case "$EXPECTED_HEAD" in
            ''|*[!0-9a-fA-F]*) echo "Refusing: expected_head_sha is not a hex sha." >&2; exit 1 ;;
          esac
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "expected_head=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"

      # Checked against the PR's live state, not the dispatch payload: a push
      # can land between the HEAD being resolved and this job starting, and a
      # verdict naming the superseded commit would be worse than no verdict.
      - name: Verify PR is open, non-draft, same-repo and still at the expected HEAD
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.resolve.outputs.expected_head }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATA=$(gh pr view "$PR_NUMBER" \
            --repo "$TARGET_REPO" \
            --json state,isDraft,headRefOid,isCrossRepository)
          ACTUAL_HEAD=$(echo "$DATA" | jq -r .headRefOid)
          STATE=$(echo "$DATA" | jq -r .state)
          DRAFT=$(echo "$DATA" | jq -r .isDraft)
          CROSS_REPO=$(echo "$DATA" | jq -r .isCrossRepository)
          echo "state=$STATE draft=$DRAFT cross_repo=$CROSS_REPO expected=$EXPECTED_HEAD actual=$ACTUAL_HEAD"
          if [ "$STATE" != "OPEN" ] || [ "$DRAFT" != "false" ] || [ "$CROSS_REPO" != "false" ] || [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping review: PR is not an open, non-draft, same-repo PR still at the expected HEAD."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact PR head
        if: steps.verify.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.expected_head }}
          fetch-depth: 1

      - name: Independent Claude review
        if: steps.verify.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.resolve.outputs.pr_number }}
            EXACT HEAD: ${{ steps.resolve.outputs.expected_head }}

            You are the independent code reviewer for Rick Loop. This is READ-ONLY review work.
            Do not edit files, commit, push, merge, or modify the implementation.

            Review the exact PR HEAD above. Start with the PR diff and only inspect repository
            files that are relevant to changed behavior or governing specs/protocols. Inspect CI
            state only with non-watching commands; never invoke any watch/poll-until-complete mode
            from inside the review because the current Claude review is itself one of the checks.
            Focus on correctness, regressions, state-machine/terminality errors, security, data
            integrity, concurrency, date/time semantics, test quality, missing negative or edge-case
            coverage, and violations of reviewed specs or loop invariants.

            Be economical with tool calls: do not repeatedly inspect the same evidence, and do not
            explore unrelated repository areas. Conclude as soon as the actionable review is complete.

            Findings must be concrete and actionable. Use inline comments for specific defects.
            Do not create an inline comment merely for style preference or praise.

            At the end, publish exactly one top-level PR result comment with `gh pr comment`.

            If and only if there are ZERO actionable findings of any severity and ZERO inline
            findings created by this review, the top-level comment MUST begin exactly:

            Reviewed commit: ${{ steps.resolve.outputs.expected_head }}
            No major issues found.
            Review provider: Claude Code Action

            If there is ANY actionable finding, the top-level comment MUST instead begin:

            Reviewed commit: ${{ steps.resolve.outputs.expected_head }}
            Review result: FINDINGS
            Review provider: Claude Code Action

            In a findings result, never use the phrase `no major issues` anywhere. A clean
            result is exact-head evidence used by a deterministic merge gate, so never mix a
            clean verdict with findings or uncertainty.
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git status:*),Bash(git rev-parse:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*)"
